[package]
name = "mx"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
aws-config = "1.8"
aws-credential-types = "1.2"
aws-sdk-s3 = "1.79"
aws-smithy-http-client = { version = "1.1", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "1.11", features = ["client", "http-1x"] }
aws-smithy-types = { version = "1.4", features = ["http-body-1-x"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
http = "1"
http-body = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
md-5 = "0.10"
rpassword = "7.3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tabwriter = "1.4"
tempfile = "3.14"
tokio = { version = "1.45", features = ["fs", "io-util", "net", "rt-multi-thread", "time"] }
tower-service = "0.3"
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
