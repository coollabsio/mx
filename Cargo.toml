[package]
name = "mx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
aws-config = "1.8"
aws-credential-types = "1.2"
aws-sdk-s3 = "1.79"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tabwriter = "1.4"
tempfile = "3.14"
tokio = { version = "1.45", features = ["rt-multi-thread"] }
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
