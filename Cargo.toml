[package]
name = "mx"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
aws-config = "1.8"
aws-credential-types = "1.2"
aws-sdk-s3 = "1.79"
aws-smithy-http-client = { version = "1.1", features = ["rustls-aws-lc"] }
aws-lc-rs = { version = "1.16", default-features = false, features = ["aws-lc-sys"] }
aws-sigv4 = "1.4"
aws-smithy-runtime-api = { version = "1.11", features = ["client", "http-1x"] }
aws-smithy-types = { version = "1.4", features = ["http-body-1-x"] }
aws-smithy-xml = "0.60"
base64 = "0.22"
bytes = "1"
bzip2 = "0.6"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6.0"
flate2 = "1.1"
http = "1"
http-body = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
md-5 = "0.10"
mime_guess = "2.0"
regex = "1"
rpassword = "7.3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
shlex = "1.3"
tabwriter = "1.4"
tempfile = "3.14"
tokio = { version = "1.45", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower-service = "0.3"
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(target_os = \"linux\")".dependencies]
xattr = "1.6"

# musl's malloc serializes on one lock; the static Linux build uses mimalloc instead.
[target."cfg(target_env = \"musl\")".dependencies]
mimalloc = { version = "0.1", default-features = false }

# mc watches local folders with rjeczalik/notify on non-Linux OSes (FSEvents, ReadDirectoryChangesW).
[target."cfg(not(target_os = \"linux\"))".dependencies]
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# madmin response decryption derives argon2id keys (64 MiB); keep debug builds fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Smaller release binaries (about half the size of the default profile) without
# giving up speed: keep opt-level 3 and unwinding panics.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
