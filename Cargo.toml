[package]
name = "mx"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
aws-config = "1.8"
aws-credential-types = "1.2"
aws-sdk-s3 = "1.79"
aws-smithy-http-client = { version = "1.1", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "1.11", features = ["http-1x"] }
aws-lc-rs = { version = "1.16", default-features = false, features = ["aws-lc-sys"] }
aws-sigv4 = "1.4"
aws-smithy-xml = "0.60"
http = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
md-5 = "0.10"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tabwriter = "1.4"
tempfile = "3.14"
tokio = { version = "1.45", features = ["fs", "io-util", "net", "rt-multi-thread"] }
url = "2.5"

[dev-dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
assert_cmd = "2.0"
predicates = "3.1"
