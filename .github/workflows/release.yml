name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Version data shared by every build: crate version (must match the tag), commit time
  # (SOURCE_DATE_EPOCH) and the mc-style release tag build.rs derives from it.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      epoch: ${{ steps.meta.outputs.epoch }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        name: Check tag and Cargo.toml version
        run: |
          set -eu
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi
          epoch="$(git log -1 --format=%ct HEAD)"
          release="$(date -u -d "@$epoch" +RELEASE.%Y-%m-%dT%H-%M-%SZ)"
          {
            echo "version=$version"
            echo "epoch=$epoch"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "mx $version, commit $GITHUB_SHA, $release"

  # Test gate: the CI workflow (without the informational mc-parity job) for this commit.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      skip-parity: true

  # Static musl binaries from the Dockerfile `build` stage on native runners (no QEMU).
  linux:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: build
          load: true
          tags: mx-build:local
          build-args: |
            MX_COMMIT_ID=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ needs.meta.outputs.epoch }}
          cache-from: type=gha,scope=mx-build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=mx-build-${{ matrix.arch }}
      - name: Copy static binary
        run: |
          set -eu
          asset="mx-linux-${{ matrix.arch }}"
          mkdir -p dist
          cid="$(docker create mx-build:local)"
          docker cp "$cid:/mx" "dist/$asset"
          docker rm "$cid" >/dev/null
          chmod +x "dist/$asset"
          readelf -d "dist/$asset" > dynamic.txt
          if grep -q NEEDED dynamic.txt; then
            echo "::error::$asset must be statically linked"
            exit 1
          fi
      - name: Check version
        run: >-
          sh .github/scripts/check-version.sh dist/mx-linux-${{ matrix.arch }}
          "${{ needs.meta.outputs.version }}" "$GITHUB_SHA" "${{ needs.meta.outputs.release }}"
      - run: sh .github/scripts/smoke-local.sh dist/mx-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: mx-linux-${{ matrix.arch }}
          path: dist/mx-linux-${{ matrix.arch }}
          if-no-files-found: error

  # macOS and Windows binaries on native runners (same setup as the CI `build` job).
  native:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: mx-darwin-arm64
          # Last Intel macOS image (until Aug 2027); then cross-compile on macos-latest.
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: mx-darwin-amd64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: mx-windows-amd64.exe
    runs-on: ${{ matrix.runner }}
    env:
      MX_COMMIT_ID: ${{ github.sha }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
      AWS_LC_SYS_PREBUILT_NASM: 1
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Collect binary
        run: |
          set -eu
          mkdir -p dist
          src="target/${{ matrix.target }}/release/mx"
          case "${{ matrix.target }}" in *windows*) src="$src.exe" ;; esac
          cp "$src" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          case "${{ matrix.target }}" in
            *windows*) ;;
            *) otool -L "dist/${{ matrix.asset }}" ;;
          esac
      - name: Check version
        run: >-
          sh .github/scripts/check-version.sh dist/${{ matrix.asset }}
          "${{ needs.meta.outputs.version }}" "$GITHUB_SHA" "${{ needs.meta.outputs.release }}"
      - run: sh .github/scripts/smoke-local.sh dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # Publishes only after the test gate and every build succeeded.
  publish:
    needs: [meta, ci, linux, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: mx-*
          merge-multiple: true
      - name: Checksums
        run: |
          set -eu
          cd dist
          chmod +x mx-*
          sha256sum mx-darwin-amd64 mx-darwin-arm64 mx-linux-amd64 mx-linux-arm64 \
            mx-windows-amd64.exe > SHA256SUMS
          cat SHA256SUMS
          cp ../Dockerfile.release Dockerfile
      - name: Attest binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/mx-darwin-amd64
            dist/mx-darwin-arm64
            dist/mx-linux-amd64
            dist/mx-linux-arm64
            dist/mx-windows-amd64.exe

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
      # Plain multi-arch index (no BuildKit attestation manifests, so `docker manifest
      # inspect` shows only linux/amd64 + linux/arm64); provenance is a GitHub attestation
      # pushed to GHCR as an OCI referrer below.
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
      - name: Attest image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@v7
        with:
          name: mx-release
          path: |
            dist/mx-*
            dist/SHA256SUMS
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: |
            dist/mx-darwin-amd64
            dist/mx-darwin-arm64
            dist/mx-linux-amd64
            dist/mx-linux-arm64
            dist/mx-windows-amd64.exe
            dist/SHA256SUMS
