name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: sh tests/live_minio.sh
      - run: docker build --tag mx:test .
      - run: sh tests/container_smoke.sh mx:test

  # Side-by-side output parity with the pinned upstream mc (tests/mc.version). Informational:
  # known gaps are #[ignore]d in tests/live_mc_parity*.rs; this job only guards fixed cases.
  mc-parity:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: target/mc-ref
          key: mc-ref-${{ hashFiles('tests/mc.version', 'tests/mc_ref.sh') }}
      - run: MX_MC_PARITY=1 sh tests/live_minio.sh 'live_mc_parity*'
